name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      # The navigation tests drive real keypresses through timing windows, so a
      # flake here is worth looking at rather than re-running.
      - run: bun test
      - run: bun run build
